---
# ============================================================
# 31_ray.yml - Instalacion de Ray
# ============================================================
- name: Instalar Ray
  hosts: cluster
  become: true

  tasks:
    - name: Instalar Ray via pip
      pip:
        name: "ray[default]"
        state: present
        executable: pip3

    - name: Configurar Ray head
      copy:
        dest: /etc/profile.d/ray.sh
        content: |
          export RAY_ADDRESS=ray://192.168.1.10:6380
        mode: '0644'
      when: inventory_hostname in groups['manager']

- name: Arrancar Ray head
  hosts: manager
  become: false

  tasks:
    - name: Arrancar Ray en el manager
      shell: |
        ray start --head --port=6380 --dashboard-port=8265 --node-ip-address=192.168.1.10
      args:
        creates: /tmp/ray/raylet_socket

- name: Arrancar Ray en los workers
  hosts: compute
  become: false

  tasks:
    - name: Conectar worker al head
      shell: |
        ray start --address=192.168.1.10:6380
      args:
        creates: /tmp/ray/raylet_socket