---
# ============================================================
# 01_ssh_keys.yml - Distribucion de claves SSH
# ============================================================
- name: Distribuir claves SSH entre nodos
  hosts: cluster
  become: true
  gather_facts: false

  vars:
    ssh_user: "{{ ansible_user | default('cluster0') }}"

  tasks:
    - name: Asegurar directorio .ssh
      file:
        path: "/home/{{ ssh_user }}/.ssh"
        state: directory
        owner: "{{ ssh_user }}"
        group: "{{ ssh_user }}"
        mode: '0700'

    - name: Copiar clave publica al authorized_keys
      authorized_key:
        user: "{{ ssh_user }}"
        state: present
        key: "{{ lookup('file', '~/.ssh/id_ed25519.pub') }}"

    - name: Configurar ssh client
      copy:
        dest: "/home/{{ ssh_user }}/.ssh/config"
        content: |
          Host *
              StrictHostKeyChecking no
              UserKnownHostsFile /dev/null
              LogLevel ERROR
        owner: "{{ ssh_user }}"
        group: "{{ ssh_user }}"
        mode: '0600'